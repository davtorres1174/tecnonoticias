<!-- Estructura HTML5 basica (doctype, html, head, meta, title, link, body): visto en Lectura fundamental 2 - HTML -->
<!-- Vinculacion de hoja de estilos externa <link rel="stylesheet">: visto en Lectura fundamental 3 - CSS -->
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Todas las noticias · TecnoNoticias</title>
  <meta name="description" content="Catalogo completo de noticias tecnologicas. Filtra por categoria.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="catalog">
  <header class="header" id="site-header"></header>

  <main>
    <section class="section">
      <div class="page-header">
        <div class="page-eyebrow">
          <span class="page-eyebrow-line"></span>
          <span class="page-eyebrow-text">Catálogo</span>
        </div>
        <h1 class="page-title">Todas las noticias</h1>
      </div>

      <!-- Filtros por categoria (renderizados por JS) -->
      <div class="filters" id="filtros"></div>

      <!-- Grid de noticias -->
      <div class="grid grid-3" id="lista-noticias"></div>
    </section>
  </main>

  <footer class="footer" id="site-footer"></footer>

  <script src="js/common.js"></script>
  <script src="js/noticias.js"></script>
</body>
</html>
