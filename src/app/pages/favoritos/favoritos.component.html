<section class="section">
  <div class="page-header">
    <div class="page-eyebrow">
      <span class="page-eyebrow-line"></span>
      <span class="page-eyebrow-text">Colección personal</span>
    </div>
    <h1 class="page-title">Mis favoritos</h1>
    <p class="page-subtitle">{{ resumen() }}</p>
  </div>

  @if (cargando()) {
    <p class="estado-mensaje">Cargando…</p>
  } @else {
    <div class="grid grid-3">
      @for (noticia of guardadas(); track noticia.id) {
        <app-noticia-card [noticia]="noticia" />
      } @empty {
        <!-- Estado vacio: igual al mockup de Favoritos (Figura 4) -->
        <div class="empty-state grid-completa">
          <div class="empty-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
            </svg>
          </div>
          <p class="empty-text">Guarda artículos desde el catálogo</p>
          <a routerLink="/noticias" class="btn btn-primary">Explorar noticias</a>
        </div>
      }
    </div>
  }
</section>
