<!-- Etiqueta semantica <header> y menu con <nav> y enlaces: visto en Lectura fundamental 2 - HTML -->
<header class="header">
  <div class="header-inner">
    <a routerLink="/" class="brand" aria-label="Ir al inicio" (click)="cerrarMenu()">
      <app-logo texto="NOTICIAS" />
    </a>

    <nav class="nav" aria-label="Menú principal">
      <!-- @for recorre el arreglo de items y genera un enlace por cada uno (estructura de control de Angular) -->
      @for (item of items; track item.ruta) {
        <a
          class="nav-item"
          [routerLink]="item.ruta"
          routerLinkActive="active"
          [routerLinkActiveOptions]="{ exact: !!item.exacta }"
        >
          {{ item.label }}
          @if (item.ruta === '/favoritos' && favoritos.total() > 0) {
            <span class="nav-badge">{{ favoritos.total() }}</span>
          }
        </a>
      }
    </nav>

    <!-- Event binding (click): abre o cierra el menu en pantallas pequenas -->
    <button class="nav-toggle" type="button" (click)="alternarMenu()" [attr.aria-expanded]="menuAbierto()" aria-label="Abrir menú">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        @if (menuAbierto()) {
          <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd"/>
        } @else {
          <path fill-rule="evenodd" d="M3 5a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 10a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM3 15a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1z" clip-rule="evenodd"/>
        }
      </svg>
    </button>
  </div>

  <!-- Menu movil: la clase "open" se agrega con class binding cuando menuAbierto() es true -->
  <div class="nav-mobile container" [class.open]="menuAbierto()">
    @for (item of items; track item.ruta) {
      <a
        class="nav-item"
        [routerLink]="item.ruta"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: !!item.exacta }"
        (click)="cerrarMenu()"
      >
        {{ item.label }}@if (item.ruta === '/favoritos' && favoritos.total() > 0) { ({{ favoritos.total() }}) }
      </a>
    }
  </div>
</header>
