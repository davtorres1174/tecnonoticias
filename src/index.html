<!-- Estructura HTML5 basica (doctype, html, head, meta, title, body): visto en Lectura fundamental 2 - HTML -->
<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>TecnoNoticias · El futuro, hoy</title>
  <!-- base href: ruta raiz desde la que Angular resuelve rutas e imagenes.
       Para GitHub Pages se reemplaza al compilar con: ng build --base-href /tecnonoticias/ -->
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Periodico digital de tecnologia. Noticias verificadas sobre IA, ciberseguridad, exploracion espacial y mas.">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Hoja de estilos externa vinculada con <link rel="stylesheet">: visto en Lectura fundamental 3 - CSS -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,900;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Componente raiz de Angular: aqui se renderiza toda la aplicacion -->
  <app-root></app-root>
</body>
</html>
